name: Interactive Bale GitHub Downloader

on:
  workflow_dispatch:
  schedule:
    # Best-effort every five minutes; GitHub may delay or skip scheduled runs.
    - cron: "3-58/5 * * * *"

permissions:
  contents: write

concurrency:
  group: bale-interactive-bot
  cancel-in-progress: false

jobs:
  serve-bale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out bot source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test before touching live state
        run: python -m pytest -q
      - name: Poll Bale and deliver repository updates
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional repository variable; defaults to false, never deletes a
          # webhook without an explicit opt-in.
          BALE_RESET_WEBHOOK: ${{ vars.BALE_RESET_WEBHOOK || 'false' }}
        run: python -m bale_downloader
