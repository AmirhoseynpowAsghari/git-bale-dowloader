
    
  
name: Interactive Bale GitHub Downloader

on:
  workflow_dispatch:
  schedule:
    # Every 5 minutes, starting at minute 3. GitHub can delay scheduled runs.
    - cron: '3-58/5 * * * *'

permissions:
  contents: write

concurrency:
  group: bale-interactive-bot
  cancel-in-progress: false

jobs:
  serve-bale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out bot source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Poll Bale and deliver repo updates
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bot.py

